# Local development services.
#
#   docker compose up -d            -> metadata DB (5432) + sample target DB (5433)
#   docker compose --profile full up -> also builds and runs the API container
services:
  metadata-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: querylab
      POSTGRES_PASSWORD: querylab
      POSTGRES_DB: querylab
    ports:
      - "5432:5432"
    volumes:
      - metadata-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querylab -d querylab"]
      interval: 5s
      timeout: 3s
      retries: 10

  # A separate PostgreSQL instance with demo data that users can connect to
  # from QueryLab. Seeded with a least-privilege, read-only role.
  sample-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sample_owner
      POSTGRES_PASSWORD: sample_owner
      POSTGRES_DB: sampledb
    ports:
      - "5433:5432"
    volumes:
      - sample-data:/var/lib/postgresql/data
      - ./scripts/sample-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sample_owner -d sampledb"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API as it runs in production (release build, non-root, JSON logs).
  api:
    profiles: ["full"]
    build: ./backend
    depends_on:
      metadata-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://querylab:querylab@metadata-db:5432/querylab
      # Development key and plain HTTP: run in development mode locally.
      APP_ENV: development
      LOG_FORMAT: json
      ENCRYPTION_KEY: ngSxD0iS9jusyKYm69L1zh9617mM1Y9WJ8TeX3N0TrU=
      COOKIE_SECURE: "false"
      ALLOW_PRIVATE_NETWORKS: "true"
    ports:
      - "8080:8080"

volumes:
  metadata-data:
  sample-data:
